<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bio.link — profile</title>
  <meta name="description" content="My personal bio link page." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Background layers -->
  <video id="bg-video" class="bg-video" autoplay muted loop playsinline hidden></video>
  <canvas id="bg-canvas" class="bg-canvas"></canvas>
  <div class="bg-overlay"></div>

  <!-- Cursor trail canvas -->
  <canvas id="cursor-canvas" class="cursor-canvas"></canvas>

  <!-- Click to enter splash -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <p id="splash-text" class="splash-text">click to enter...</p>
    </div>
  </div>

  <!-- Main profile -->
  <main id="app" class="app" aria-hidden="true">
    <div id="card" class="card">
      <div class="card-glare"></div>

      <div class="banner" id="banner"></div>

      <div class="profile-top">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" src="assets/avatar.svg" alt="avatar" />
          <span id="status-dot" class="status-dot online" title="online"></span>
        </div>

        <h1 id="username" class="username"></h1>

        <div id="custom-status" class="custom-status" hidden></div>

        <div id="badges" class="badges"></div>

        <p class="bio"><span id="bio-text"></span><span class="caret">|</span></p>

        <div class="meta">
          <span class="meta-item" id="location-wrap">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
            <span id="location"></span>
          </span>
          <span class="meta-item">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
            <span id="views">0</span>
          </span>
        </div>
      </div>

      <!-- Discord-style presence -->
      <div id="presence" class="presence">
        <div class="presence-head">
          <span class="presence-label" id="presence-label">Activity</span>
          <span class="presence-status" id="presence-status"></span>
        </div>
        <div class="presence-body">
          <img id="presence-img" class="presence-img" src="assets/avatar.svg" alt="" />
          <div class="presence-info">
            <div class="presence-name" id="presence-name"></div>
            <div class="presence-activity" id="presence-activity"></div>
            <div class="presence-time" id="presence-time"></div>
          </div>
        </div>
      </div>

      <!-- Social icons -->
      <div id="socials" class="socials"></div>

      <!-- Link buttons -->
      <div id="links" class="links"></div>

      <!-- Music player -->
      <div id="player" class="player">
        <button id="play-btn" class="play-btn" aria-label="Play / pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <div class="player-info">
          <div class="track-title" id="track-title">No track</div>
          <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
        </div>
        <button id="next-btn" class="icon-btn" aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Volume control (bottom-left) -->
    <div class="volume">
      <button id="mute-btn" class="icon-btn" aria-label="Mute">
        <svg id="icon-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg id="icon-mute" viewBox="0 0 24 24" hidden><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A9 9 0 0 0 14 3.2v2.1a7 7 0 0 1 5 6.7zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4L9.9 6.1 12 8.2V4z"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.4" aria-label="Volume" />
    </div>

    <footer class="footer">
      <span id="footer-text"></span>
    </footer>
  </main>

  <audio id="audio" preload="auto"></audio>

  <!-- Copy toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/background.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/discord.js"></script>
</body>
</html>
