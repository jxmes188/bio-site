<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash" id="dash">

    <!-- ===== Sidebar (desktop) ===== -->
    <aside class="side">
      <a class="side-brand" href="/"><span class="brand-mark"><svg viewBox="0 0 64 64"><path d="M32 6c1.8 12.6 8 18.9 20.6 20.6v.5C40 28.9 33.8 35.2 32 47.8h-.5C29.7 35.2 23.4 28.9 10.8 27.1v-.5C23.4 24.9 29.7 18.6 31.5 6z"/></svg></span><span class="site-name">bio</span></a>
      <nav class="side-nav" id="side-nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <a class="side-page" id="side-page" href="#" target="_blank" rel="noopener">
          <img id="side-avatar" src="/img/avatar.svg" alt="" />
          <span><b id="side-name"></b><small id="side-link"></small></span>
          <i data-i="external"></i>
        </a>
        <div class="side-actions">
          <button class="icon-btn" id="theme-toggle" title="Light / dark" aria-label="Switch light or dark dashboard"></button>
          <a class="icon-btn" id="admin-link" href="/admin" title="Admin" aria-label="Admin" hidden><i data-i="shield"></i></a>
          <button class="icon-btn" id="logout" title="Log out" aria-label="Log out"><i data-i="logout"></i></button>
        </div>
      </div>
    </aside>

    <!-- ===== Main column ===== -->
    <main class="main">
      <header class="bar">
        <div class="bar-title">
          <h1 id="section-title">Profile</h1>
        </div>
        <div class="search" id="search">
          <i data-i="search"></i>
          <input id="search-input" type="search" placeholder="Search settings" autocomplete="off" aria-label="Search settings" />
          <kbd>/</kbd>
          <ul class="search-results" id="search-results" role="listbox" hidden></ul>
        </div>
        <div class="bar-actions">
          <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><i data-i="undo"></i></button>
          <button class="icon-btn" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><i data-i="redo"></i></button>
          <span class="save-state" id="save-state" role="status"><i></i><span>Saved</span></span>
        </div>
      </header>

      <div class="section-head" id="section-head">
        <p class="section-sub" id="section-sub"></p>
        <div class="section-tools">
          <label class="switch" id="adv-switch"><input type="checkbox" id="adv-toggle" /><span></span>Advanced</label>
          <button class="text-btn" id="reset-section">Reset section</button>
        </div>
      </div>

      <div class="content" id="content"></div>
    </main>

    <!-- ===== Live preview ===== -->
    <aside class="preview" id="preview" aria-label="Live preview">
      <div class="preview-head">
        <span class="preview-label"><i class="live-dot"></i>Live preview</span>
        <div class="preview-actions">
          <a class="btn btn-ghost btn-sm" id="open-page" href="#" target="_blank" rel="noopener">Open <i data-i="external"></i></a>
          <button class="icon-btn preview-close" id="preview-close" aria-label="Close preview"><i data-i="x"></i></button>
        </div>
      </div>
      <div class="phone"><div class="phone-screen" id="preview-stage"></div></div>
    </aside>
  </div>

  <!-- ===== Phone: bottom tabs + preview button ===== -->
  <button class="preview-fab" id="preview-open"><i data-i="eye"></i>Preview</button>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- In-page confirm dialog -->
  <div class="dialog" id="dialog" hidden>
    <div class="dialog-card" role="alertdialog" aria-modal="true" aria-labelledby="dialog-text">
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" id="dialog-no">Cancel</button>
        <button class="btn btn-danger" id="dialog-yes">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/js/ui-icons.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/site-cursor.js"></script>
  <script src="/js/dash-schema.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
